<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PROSPER SYSTEM</title>

<style>
:root{
--blue:#7FB6C6;
--bg:#0b0f12;
--card:#11181d;
--line:#1f2c33;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:#ddd;
font-family:sans-serif;
}

.header{
padding:20px;
border-bottom:1px solid var(--line);
}

.logo{
font-size:32px;
font-weight:900;
letter-spacing:4px;
color:var(--blue);
}

.tabs{
display:flex;
border-bottom:1px solid var(--line);
}

.tab{
flex:1;
padding:14px;
background:none;
border:none;
color:#777;
font-weight:bold;
cursor:pointer;
}

.tab.active{
color:var(--blue);
border-bottom:2px solid var(--blue);
}

.panel{
display:none;
padding:16px;
}

.panel.active{
display:block;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:14px;
margin-bottom:14px;
}

.lbl{
font-size:12px;
color:#777;
margin-bottom:4px;
}

input,select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #333;
background:#0f1418;
color:white;
margin-bottom:12px;
}

button{
border:none;
border-radius:8px;
padding:12px;
font-weight:bold;
cursor:pointer;
}

.btn{
background:var(--blue);
color:black;
width:100%;
}

.line{
display:flex;
gap:8px;
margin-bottom:8px;
}

.line input{
margin-bottom:0;
}

.total{
font-size:28px;
font-weight:900;
color:var(--blue);
text-align:right;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">PROSPER</div>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab(0)">見積作成</button>
<button class="tab" onclick="switchTab(1)">見積一覧</button>
<button class="tab" onclick="switchTab(2)">顧客管理</button>
</div>

<div class="panel active">

<div class="card">

<div class="lbl">顧客名</div>
<input id="customer">

<div class="lbl">車名</div>
<input id="car">

<div class="lbl">ナンバー</div>
<input id="plate">

<div class="lbl">工賃</div>
<div id="laborArea"></div>

<button class="btn" onclick="addLabor()">
＋ 工賃追加
</button>

<br><br>

<div class="lbl">部品</div>
<div id="partsArea"></div>

<button class="btn" onclick="addParts()">
＋ 部品追加
</button>

<div class="total" id="total">
¥0
</div>

<br>

<button class="btn" onclick="saveQuote()">
見積保存
</button>

</div>
</div>

<div class="panel">
<div id="quoteList"></div>
</div>

<div class="panel">
<div class="card">
<div class="lbl">顧客管理 v2準備中</div>
</div>
</div>

<script>

let quotes=[]

function switchTab(index){

document.querySelectorAll(".tab").forEach((t,i)=>{
t.classList.toggle("active",i===index)
})

document.querySelectorAll(".panel").forEach((p,i)=>{
p.classList.toggle("active",i===index)
})

if(index===1){
renderQuotes()
}
}

function addLabor(){

const row=document.createElement("div")
row.className="line"

row.innerHTML=`
<input placeholder="工賃名">
<input type="number" placeholder="金額" oninput="calcTotal()">
`

document.getElementById("laborArea").appendChild(row)
}

function addParts(){

const row=document.createElement("div")
row.className="line"

row.innerHTML=`
<input placeholder="部品名">
<input type="number" placeholder="金額" oninput="calcTotal()">
`

document.getElementById("partsArea").appendChild(row)
}

function calcTotal(){

let total=0

document.querySelectorAll('input[type="number"]').forEach(el=>{
total+=Number(el.value)||0
})

document.getElementById("total").textContent=
"¥"+total.toLocaleString()
}

function saveQuote(){

const data={
customer:document.getElementById("customer").value,
car:document.getElementById("car").value,
plate:document.getElementById("plate").value,
total:document.getElementById("total").textContent
}

quotes.unshift(data)

localStorage.setItem(
"prosper_quotes",
JSON.stringify(quotes)
)

alert("保存しました")

renderQuotes()
}

function renderQuotes(){

quotes=
JSON.parse(
localStorage.getItem("prosper_quotes")||"[]"
)

const list=document.getElementById("quoteList")

list.innerHTML=""

quotes.forEach(q=>{

const div=document.createElement("div")

div.className="card"

div.innerHTML=`
<div>${q.customer}</div>
<div>${q.car}</div>
<div>${q.plate}</div>
<div class="total">${q.total}</div>
`

list.appendChild(div)

})
}

window.onload=()=>{

renderQuotes()

addLabor()
addParts()

}
</script>

</body>
</html>
